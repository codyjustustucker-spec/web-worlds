name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: read

jobs:
  critical-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install development dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Lint
        run: npm run lint
      - name: Syntax validation
        run: npm run lint:syntax
      - name: Unit tests
        run: npm run test:unit
      - name: Worker API tests
        run: npm run test:api
      - name: Internal link validation
        run: npm run test:links
      - name: Critical browser suite
        run: npm run test:e2e:critical
      - name: Accessibility scan
        run: npm run test:a11y
      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  cross-browser-smoke:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Install Firefox and WebKit
        run: npx playwright install --with-deps firefox webkit
      - name: Cross-browser smoke
        run: npm run test:e2e:cross
